<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tachyon Charts – basic example</title>
    <style>
      body {
        margin: 0;
        background: #181c24;
        color: #c8d0dc;
        font-family: sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      p {
        position: absolute;
        top: 8px;
        left: 12px;
        margin: 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <p id="status"></p>
    <p id="help">
      Wheel: zoom · drag: pan · Ctrl + drag: zoom into a rectangle · drag an axis: move it, Shift: scale it · arrows, +
      and −: move and zoom · Home or double click: all data · Ctrl+Z, Ctrl+Y: undo, redo · two fingers: pan and pinch
    </p>
    <div id="tooltip" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
