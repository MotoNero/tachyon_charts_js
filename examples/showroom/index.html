<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tachyon Charts – Showroom</title>
    <link id="icon" rel="icon" />
    <style>
      :root {
        --bg: #0e1116;
        --panel: #151a22;
        --line: #252c38;
        --text: #c8d0dc;
        --muted: #7d8899;
        --accent: #50aaf0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template: 56px 1fr / 220px 1fr;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      header {
        grid-column: 1 / 3;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .configurator-link {
        color: var(--accent);
        text-decoration: none;
        white-space: nowrap;
      }
      .configurator-link[hidden] {
        display: none;
      }
      header img {
        height: 28px;
      }
      header .thread {
        color: var(--muted);
        font-size: 12px;
        max-width: 300px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      header .spacer {
        flex: 1;
      }
      header label {
        color: var(--muted);
        font-size: 13px;
      }
      header .export {
        color: var(--muted);
        font-size: 13px;
      }
      header .export button {
        margin-left: 4px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 7px;
        font: inherit;
        cursor: pointer;
      }
      header .export button:disabled {
        opacity: 0.5;
      }
      header .record .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 50%;
        background: #e0453a;
      }
      header .record.recording {
        border-color: #e0453a;
        color: #ff8a80;
      }
      header .record.recording .dot {
        border-radius: 1px;
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
      header .video {
        display: inline-block;
        position: relative;
        margin-left: 4px;
      }
      header .video summary {
        cursor: pointer;
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 7px;
        color: var(--text);
      }
      header .video .panel {
        position: absolute;
        right: 0;
        top: 30px;
        z-index: 10;
        display: grid;
        gap: 8px;
        min-width: 230px;
        padding: 10px;
        background: var(--panel, var(--bg));
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      header .video .panel label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      header .video input {
        width: 64px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      header .video progress {
        width: 100%;
      }
      select {
        margin-left: 6px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 6px;
      }
      nav {
        overflow-y: auto;
        padding: 8px 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      nav h2 {
        margin: 12px 16px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      nav a {
        display: block;
        padding: 5px 16px;
        color: var(--text);
        text-decoration: none;
        border-left: 3px solid transparent;
      }
      nav a:hover {
        background: var(--bg);
      }
      nav a[aria-current='page'] {
        border-left-color: var(--accent);
        background: var(--bg);
        color: #fff;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
        min-height: 0;
        padding: 12px 16px;
        gap: 8px;
      }
      main h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
      }
      tachyon-chart {
        min-height: 0;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      main.with-overview {
        grid-template-rows: auto 2fr 1fr auto;
      }
      main.with-linked {
        grid-template-rows: auto 1fr 1fr 1fr auto;
      }
      /* A 3D chart above a 2D chart it is coupled with. */
      main.with-pair {
        grid-template-rows: auto 2fr 1fr auto;
      }
      /* A large chart above a row of charts that belong to it, such as the slices of a volume. */
      main.with-row {
        grid-template-rows: auto 3fr 2fr auto;
      }
      .chart-row {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 6px;
        min-height: 0;
      }
      tachyon-chart[hidden] {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        grid-auto-rows: minmax(150px, 1fr);
        gap: 6px;
        min-height: 0;
        overflow-y: auto;
      }
      .picker {
        color: var(--muted);
        font-size: 12px;
      }
      #hint {
        color: var(--muted);
        font-size: 12px;
      }
      #tip {
        position: fixed;
        padding: 4px 8px;
        background: #2a3140;
        border: 1px solid var(--accent);
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
      }
      @media (max-width: 700px) {
        body {
          grid-template: 56px auto 1fr / 1fr;
        }
        nav {
          display: flex;
          flex-wrap: wrap;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
        nav h2 {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img id="logo" alt="Tachyon Charts" />
      <span class="spacer"></span>
      <span id="thread" class="thread"></span>
      <a
        id="open-configurator"
        class="configurator-link"
        href="../configurator/index.html"
        target="_blank"
        rel="noopener"
        >Open in configurator</a
      >
      <span class="export">
        <span data-text="Export">Export</span>
        <button id="export-png" type="button">PNG</button>
        <button id="export-svg" type="button">SVG</button>
        <button id="export-csv" type="button">CSV</button>
        <button id="record" type="button" class="record" title="Start and stop a recording">
          <span class="dot"></span><span id="record-text" data-text="Record">Record</span>
        </button>
        <details class="video">
          <summary data-text="Video">Video</summary>
          <div class="panel">
            <label
              ><span data-text="Size">Size</span>
              <select id="video-size">
                <option value="1280">1280 × 720</option>
                <option value="1920" selected>1920 × 1080</option>
                <option value="3840">3840 × 2160</option>
              </select></label
            >
            <label
              ><span data-text="Quality">Quality</span>
              <select id="video-quality">
                <option value="6000000" data-text="Standard">Standard</option>
                <option value="12000000" data-text="High" selected>High</option>
                <option value="30000000" data-text="Very high">Very high</option>
              </select></label
            >
            <label
              ><span data-text="Length in s">Length in s</span>
              <input id="video-length" type="number" min="1" max="120" value="5"
            /></label>
            <button id="export-video" type="button" data-text="Record this length">Record this length</button>
            <progress id="video-progress" max="1" value="0" hidden></progress>
          </div>
        </details>
      </span>
      <label>
        <span data-text="Theme">Theme</span>
        <select id="theme"></select
      ></label>
      <label>
        <span data-text="Language">Language</span>
        <select id="language">
          <option value="english">English</option>
          <option value="german">Deutsch</option>
        </select></label
      >
    </header>
    <nav id="navigation"></nav>
    <main>
      <h1 id="title">Tachyon Charts</h1>
      <tachyon-chart id="chart"></tachyon-chart>
      <div id="hint"></div>
    </main>
    <div id="tip" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
