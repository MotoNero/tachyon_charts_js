<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tachyon Charts – Showroom</title>
    <link id="icon" rel="icon" />
    <style>
      :root {
        --bg: #0e1116;
        --panel: #151a22;
        --line: #252c38;
        --text: #c8d0dc;
        --muted: #7d8899;
        --accent: #50aaf0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template: 56px 1fr / 220px 1fr;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      header {
        grid-column: 1 / 3;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header img {
        height: 28px;
      }
      header .thread {
        color: var(--muted);
        font-size: 12px;
      }
      header .spacer {
        flex: 1;
      }
      header label {
        color: var(--muted);
        font-size: 13px;
      }
      select {
        margin-left: 6px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 6px;
      }
      nav {
        overflow-y: auto;
        padding: 8px 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      nav h2 {
        margin: 12px 16px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      nav a {
        display: block;
        padding: 5px 16px;
        color: var(--text);
        text-decoration: none;
        border-left: 3px solid transparent;
      }
      nav a:hover {
        background: var(--bg);
      }
      nav a[aria-current='page'] {
        border-left-color: var(--accent);
        background: var(--bg);
        color: #fff;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
        min-height: 0;
        padding: 12px 16px;
        gap: 8px;
      }
      main h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
      }
      tachyon-chart {
        min-height: 0;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      tachyon-chart[hidden] {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        grid-auto-rows: minmax(150px, 1fr);
        gap: 6px;
        min-height: 0;
        overflow-y: auto;
      }
      .picker {
        color: var(--muted);
        font-size: 12px;
      }
      #hint {
        color: var(--muted);
        font-size: 12px;
      }
      #tip {
        position: fixed;
        padding: 4px 8px;
        background: #2a3140;
        border: 1px solid var(--accent);
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
      }
      @media (max-width: 700px) {
        body {
          grid-template: 56px auto 1fr / 1fr;
        }
        nav {
          display: flex;
          flex-wrap: wrap;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
        nav h2 {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img id="logo" alt="Tachyon Charts" />
      <span class="spacer"></span>
      <span id="thread" class="thread"></span>
      <label>
        <span data-text="Theme">Theme</span>
        <select id="theme"></select
      ></label>
      <label>
        <span data-text="Language">Language</span>
        <select id="language">
          <option value="english">English</option>
          <option value="german">Deutsch</option>
        </select></label
      >
    </header>
    <nav id="navigation"></nav>
    <main>
      <h1 id="title"></h1>
      <tachyon-chart id="chart"></tachyon-chart>
      <div id="hint"></div>
    </main>
    <div id="tip" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
